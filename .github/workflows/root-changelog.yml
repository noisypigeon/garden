name: root-changelog

# Every merged PR gets exactly one line in the root CHANGELOG.md (DEV-0160).
#
# A thin caller since noisypigeon/noisypigeon#306: the job body -- fetch the
# library, pick the tag, run root-changelog.sh, push with retry -- lives in
# pigeon-lib's spoke-root-changelog.yml, at the version /.lib-version pins. This
# file keeps only what cannot live there: the trigger, the merged-only gate,
# permissions, concurrency, and this repo's tag precedence.
#
# Deliberately no `paths:` filter: the whole point is that no merged PR is
# exempt.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Own group, as in pigeon-lib: GitHub keeps one pending run per group, so a
# shared group can silently drop a writer. The reusable retries a rejected push.
concurrency:
  group: main-writer-rollup
  cancel-in-progress: false

jobs:
  rollup:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/pigeon-lib/.github/workflows/spoke-root-changelog.yml@workflows/v1.6.0
    with:
      # First match wins. web/ is labelled pigeon.dev: the directory was
      # renamed by DEV-0162, the site it publishes was not.
      precedence: |
        ^web/=pigeon.dev
        ^(terraform/|root\.hcl$|spoke\.hcl$|\.sops\.yaml$)=terraform
        ^adr/=adr
        ^\.github/=ci
    secrets: inherit
