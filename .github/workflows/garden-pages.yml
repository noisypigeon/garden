# Deploys web/ to GitHub Pages. Cross-repo call into
# noisypigeon/pigeon-lib's zola-site-pages.yml -- deploy-pages always targets
# the calling repo's own Pages site, so this caller has to live here, where that
# Pages site actually is (ADR-0156). It is the one caller LIB-0002 could not move.
#
# Pinned to a version rather than @main (LIB-0001 invariant 2). fetch_script
# materializes pigeon-lib at the version /.lib-version pins; theme_script and
# extra_step then run that clone's copies of resolve-theme.sh and the module
# redirect generator, both of which resolve their own root from their own
# location rather than this repo's.
name: Deploy garden

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: garden-pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: noisypigeon/pigeon-lib/.github/workflows/zola-site-pages.yml@workflows/v3.0.0
    with:
      src_dir: web
      build_cmd: "zola build"
      fetch_script: fetch-lib.sh
      theme_script: .lib-src/zola-site/resolve-theme.sh
      extra_step: ".lib-src/.github/scripts/generate-module-redirects.sh --content-root web/content"
