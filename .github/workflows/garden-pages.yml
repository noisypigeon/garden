# Lives here, not in library: deploy-pages only deploys the calling repo's site.
name: Deploy garden

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: garden-pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: noisypigeon/library/.github/workflows/zola-site-pages.yml@workflows/v4.9.1
    with:
      src_dir: web
      build_cmd: "zola build"
      fetch_script: fetch-lib.sh
      theme_script: .lib-src/zola-site/resolve-theme.sh
      terraform_docs: true
      extra_step: ".lib-src/.github/scripts/generate-module-redirects.sh --content-root web/content --static-root web/static"
